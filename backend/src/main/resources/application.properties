spring.application.name=backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aPi-hour}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.session.persistent=false

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=900000
jwt.refresh.expiration=604800000

# Mail Configuration (Brevo, relais SMTP)
# MAIL_USERNAME = "Identifiant SMTP" Brevo (ex: xxxxxx@smtp-brevo.com)
# MAIL_PASSWORD = "Clé SMTP" Brevo (Brevo > SMTP & API > SMTP), PAS le mot de passe du compte
# MAIL_FROM     = expéditeur validé dans Brevo (Senders, domains & dedicated IPs)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Application Configuration
app.frontend.url=${FRONTEND_URL:https://apihour2.pi-cto.top}
app.mail.from=${MAIL_FROM:noreply@pi-cto.top}